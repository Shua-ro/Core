<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Fonts: Syne, Manrope  -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Syne:wght@400..800&display=swap"
      rel="stylesheet"
    />

    <link href="style.css" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Core</title>
  </head>
  <body>
    <div class="sidebar">
      <nav>
        <h1 class="app-title">Core</h1>
      </nav>

      <!-- Icons with Text on side panel -->
      <ul class="app-maintabs">
        <li onclick="window.location.href = 'index.html'">
          <div class="dashboard list">
            <img
              class="side-icons"
              alt="Dashboard"
              src="assets/icons/layout-dashboard.svg"
            />
            <h2>Dashboard</h2>
          </div>
        </li>
        <li onclick="window.location.href = 'electricity.html'">
          <div class="Electricity list">
            <img
              src="assets/icons/bolt.svg"
              alt="Electricity"
              class="side-icons"
            />
            <h2>Electricity</h2>
          </div>
        </li>
        <li onclick="window.location.href = 'groceries.html'">
          <div class="Groceries list">
            <img
              src="assets/icons/shopping-cart.svg"
              alt="shopping-cart"
              class="side-icons"
            />
            <h2>Groceries</h2>
          </div>
        </li>
        <li onclick="window.location.href = 'pigery.html'" class="selected">
          <div class="Pigery list">
            <img
              src="assets/icons/paw.svg"
              alt="Animal Paw"
              class="side-icons"
            />
            <h2>Pigery</h2>
          </div>
        </li>
        <li onclick="window.location.href = 'allowance.html'">
          <div class="Allowances list">
            <img
              src="assets/icons/wallet.svg"
              alt="wallet"
              class="side-icons"
            />
            <h2>Allowance</h2>
          </div>
        </li>
        <li onclick="window.location.href = 'loans.html'">
          <div class="Loans list">
            <img
              src="assets/icons/file-invoice.svg"
              alt="file invoice"
              class="side-icons"
            />
            <h2>Loans</h2>
          </div>
        </li>
      </ul>
    </div>
    <div class="main-content">
      <nav>
        <h1 class="content-title">Pigery</h1>
      </nav>
    </div>
  </body>
  <script src="app.js"></script>
</html>
